<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ego</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 480px; margin: 0 auto; padding: 20px 16px 60px;
         background: #150a10; color: #eee; }
  h1 { color: #c9a24b; font-size: 22px; letter-spacing: 2px; }
  .card { background: #241018; border: 1px solid #3a2412; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  label { display: block; margin: 10px 0 4px; font-size: 14px; color: #ccc; }
  input[type=text], input[type=number] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #3a2412;
         background: #1a0d13; color: #eee; box-sizing: border-box; }
  input[type=file] { width: 100%; }
  button { width: 100%; padding: 14px; background: #c9a24b; color: #150a10; border: none; border-radius: 8px;
         font-weight: bold; font-size: 16px; margin-top: 14px; }
  a { color: #c9a24b; }
  video { width: 100%; border-radius: 8px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
  small { color: #999; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
